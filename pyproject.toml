[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "exo-compact-constraints"
version = "0.1.0"
description = "Simulation framework comparing black holes, wormholes, and exotic compact objects"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "astropy>=5.0",
    "sympy>=1.12",
]

[project.optional-dependencies]
dev = ["pytest", "jupyter", "pycbc"]
docs = ["mkdocs", "mkdocstrings"]

[tool.setuptools.packages.find]
include = ["exo_compact*"]
